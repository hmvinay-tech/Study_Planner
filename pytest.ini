# pytest configuration for Study Planner

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --cov=planner
    --cov=config
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=65
    -v

markers =
    integration: marks tests as integration tests
    slow: marks tests as slow
    api: marks tests as API tests
    unit: marks tests as unit tests

[tool.coverage.run]
source = ["planner", "config"]
omit = 
    */migrations/*
    */tests/*
    */test_*.py
    *_test.py
    manage.py
    */admin.py
    */apps.py
    */asgi.py
    */wsgi.py

[tool.coverage.report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[tool.coverage.html]
directory = htmlcov