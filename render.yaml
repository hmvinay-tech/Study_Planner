services:
  - type: web
    name: study-planner
    runtime: docker
    repo: https://github.com/hmvinay-tech/Study_Planner
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: study-planner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: study-planner-cache
          type: keyvalue
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: WEB_CONCURRENCY
        value: "1"
